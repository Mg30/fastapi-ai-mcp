[project]
name = "assistant-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "dependency-injector>=4.45.0",
    "mcp>=1.2.0",
    "openai>=1.59.7",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.7.1",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "alembic>=1.14.0",
    "pytest-asyncio>=0.25.2",
    "pytest>=8.3.4",
    "ruff>=0.9.1",
    "testcontainers>=4.9.1",
]


[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    # isort
    "I001",
]
